<svg width="100%" viewBox="0 0 1080 860" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SecureBytes platform architecture, public</title>
<desc>Live lab layers. Anyone can open the status page. The Wi-Fi in the house cannot reach the lab.</desc>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#10b981"/>
<stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
<stop offset="0.45" stop-color="#10b981" stop-opacity="0.85"/>
<stop offset="1" stop-color="#10b981" stop-opacity="0.15"/>
</linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.65" fill="#ffffff" fill-opacity="0.04"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="8%" r="55%">
<stop offset="0" stop-color="#10b981" stop-opacity="0.18"/>
<stop offset="1" stop-color="#10b981" stop-opacity="0"/>
</radialGradient>
</defs>

<rect width="1080" height="860" fill="#07080d"/>
<rect width="1080" height="860" fill="url(#dots)"/>
<ellipse cx="540" cy="40" rx="420" ry="180" fill="url(#glow)"/>

<text x="64" y="64" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">SECUREBYTES</text>
<text x="1016" y="64" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2" text-anchor="end">LIVE</text>
<circle cx="948" cy="60" r="3.5" fill="#10b981"/>
<text x="64" y="108" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="600">Architecture</text>
<text x="64" y="140" fill="#8b93a7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Anyone can open the status page. The Wi-Fi in the house cannot reach the lab.</text>

<line x1="540" y1="268" x2="540" y2="620" stroke="url(#spine)" stroke-width="1.5"/>

<!-- Edge -->
<rect x="250" y="176" width="580" height="92" rx="18" fill="#10131a" stroke="#ef9f27" stroke-opacity="0.55"/>
<rect x="251" y="177" width="578" height="3" rx="1.5" fill="#ef9f27"/>
<text x="540" y="214" fill="#e8b86d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.4" text-anchor="middle">EDGE</text>
<text x="540" y="242" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Cloudflare</text>
<text x="540" y="264" fill="#8b93a7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Tunnel · Access · status page · no inbound ports</text>

<!-- Ingress -->
<text x="64" y="318" fill="#5c6478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">INGRESS</text>
<rect x="190" y="300" width="220" height="64" rx="14" fill="#10131a" stroke="#10b981" stroke-opacity="0.35"/>
<text x="300" y="328" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Tunnel daemon</text>
<text x="300" y="348" fill="#8b93a7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">cloudflared</text>

<rect x="430" y="300" width="220" height="64" rx="14" fill="#10131a" stroke="#10b981" stroke-opacity="0.55"/>
<text x="540" y="328" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Reverse proxy</text>
<text x="540" y="348" fill="#8b93a7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">nginx + wildcard TLS</text>

<rect x="670" y="300" width="220" height="64" rx="14" fill="#10131a" stroke="#22d3ee" stroke-opacity="0.45"/>
<text x="780" y="328" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle">DNS</text>
<text x="780" y="348" fill="#8b93a7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Unbound on the firewall</text>

<!-- Services, one surface -->
<rect x="64" y="396" width="952" height="196" rx="18" fill="#10131a" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="88" y="428" fill="#5c6478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SERVICES</text>
<text x="980" y="428" fill="#5c6478" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="end">containers and VMs</text>
<line x1="88" y1="444" x2="992" y2="444" stroke="#ffffff" stroke-opacity="0.06"/>

<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="88" y="484" fill="#f7f8fb" font-size="16" font-weight="600">Lab directory</text>
<text x="88" y="504" fill="#8b93a7" font-size="13">internal sign-in</text>
<text x="400" y="484" fill="#f7f8fb" font-size="16" font-weight="600">Vault</text>
<text x="400" y="504" fill="#8b93a7" font-size="13">secrets, not git</text>
<text x="712" y="484" fill="#f7f8fb" font-size="16" font-weight="600">Splunk</text>
<text x="712" y="504" fill="#8b93a7" font-size="13">homelab SIEM</text>

<line x1="88" y1="524" x2="992" y2="524" stroke="#ffffff" stroke-opacity="0.06"/>

<text x="88" y="560" fill="#f7f8fb" font-size="16" font-weight="600">Network sensor</text>
<text x="88" y="580" fill="#f87171" font-size="13">Security Onion</text>
<text x="400" y="560" fill="#f7f8fb" font-size="16" font-weight="600">Grafana</text>
<text x="400" y="580" fill="#8b93a7" font-size="13">Prometheus · push alerts</text>
<text x="712" y="560" fill="#f7f8fb" font-size="16" font-weight="600">Uptime Kuma</text>
<text x="712" y="580" fill="#8b93a7" font-size="13">public status page</text>
</g>

<!-- Segments: connected chain, then a break -->
<text x="64" y="640" fill="#5c6478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SEGMENTS</text>

<line x1="118" y1="692" x2="612" y2="692" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
<circle cx="118" cy="692" r="5" fill="#07080d" stroke="#10b981" stroke-width="2"/>
<text x="118" y="722" fill="#f7f8fb" font-size="14" font-weight="600">Lab</text>

<circle cx="282" cy="692" r="5" fill="#07080d" stroke="#10b981" stroke-width="2"/>
<text x="282" y="722" fill="#f7f8fb" font-size="14" font-weight="600">Management</text>

<circle cx="446" cy="692" r="5" fill="#07080d" stroke="#22d3ee" stroke-width="2"/>
<text x="446" y="722" fill="#f7f8fb" font-size="14" font-weight="600">IoT</text>

<circle cx="610" cy="692" r="5" fill="#07080d" stroke="#22d3ee" stroke-width="2"/>
<text x="610" y="722" fill="#f7f8fb" font-size="14" font-weight="600">DMZ</text>
</g>

<line x1="668" y1="692" x2="736" y2="692" stroke="#ef9f27" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="2 5"/>
<rect x="748" y="664" width="268" height="56" rx="14" fill="#10131a" stroke="#ef9f27" stroke-opacity="0.75"/>
<text x="882" y="688" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle">House Wi-Fi</text>
<text x="882" y="706" fill="#e8b86d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">cannot reach the lab</text>

<!-- Foundation -->
<rect x="64" y="760" width="952" height="64" rx="16" fill="#0c0e14" stroke="#ffffff" stroke-opacity="0.06"/>
<text x="88" y="786" fill="#5c6478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">INFRASTRUCTURE</text>
<text x="88" y="808" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Firewall</text>
<text x="188" y="808" fill="#5c6478" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">·</text>
<text x="204" y="808" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Switch · Wi-Fi 7</text>
<text x="360" y="808" fill="#5c6478" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">·</text>
<text x="376" y="808" fill="#f7f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Two-node Proxmox</text>
<text x="780" y="808" fill="#8b93a7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="end">NAS file share</text>
<text x="992" y="808" fill="#5c6478" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="end">not a backup host</text>
</svg>
